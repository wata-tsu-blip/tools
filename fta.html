<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTA構造化テキスト・ビジュアルコンバーター</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX Compilation in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html2canvas for Image Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>

  <style>
    /* 縦方向スクロールバーの微調整 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="h-screen w-full overflow-hidden bg-slate-50">
  <div id="root"></div>

  <!-- React code compiled dynamically via Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Inline SVG Icons (Lucide alternatives) ---
    const Plus = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M5 12h14M12 5v14" />
      </svg>
    );

    const Edit2 = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
        <path d="m15 5 4 4" />
      </svg>
    );

    const Trash2 = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6" />
      </svg>
    );

    const ZoomIn = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
        <line x1="11" y1="8" x2="11" y2="14" />
        <line x1="8" y1="11" x2="14" y2="11" />
      </svg>
    );

    const ZoomOut = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
        <line x1="8" y1="11" x2="14" y2="11" />
      </svg>
    );

    const Save = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
        <polyline points="17 21 17 13 7 13 7 21" />
        <polyline points="7 3 7 8 15 8" />
      </svg>
    );

    const X = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    );

    const Cpu = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect width="16" height="16" x="4" y="4" rx="2" />
        <rect width="6" height="6" x="9" y="9" rx="1" />
        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" />
      </svg>
    );

    const FileImage = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
        <circle cx="10" cy="13" r="2" />
        <path d="m21 17-3-3-4 4" />
      </svg>
    );

    const FileSpreadsheet = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
        <path d="M8 13h8M8 17h8M12 10v10" />
      </svg>
    );

    const Info = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4M12 8h.01" />
      </svg>
    );

    const FileText = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
        <path d="M10 9H8M16 13H8M16 17H8" />
      </svg>
    );

    const RefreshCw = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
        <path d="M16 16h5v5" />
      </svg>
    );

    const Clipboard = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
      </svg>
    );

    const Type = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="4 7 4 4 20 4 20 7" />
        <line x1="9" y1="20" x2="15" y2="20" />
        <line x1="12" y1="4" x2="12" y2="20" />
      </svg>
    );

    // --- Utility Functions ---
    const generateId = () => Math.random().toString(36).substr(2, 9);

    const downloadCSV = (nodes, topEventText) => {
      const header = "ID,親ID,要因,詳細理由,フォントサイズ,背景色,文字色,枠線色\n";
      const rows = nodes.map(n => 
        `"${n.id}","${n.parentId || ''}","${n.text.replace(/"/g, '""')}","${(n.reason || '').replace(/"/g, '""')}","${n.fontSize || ''}","${n.bgColor || ''}","${n.textColor || ''}","${n.borderColor || ''}"`
      ).join("\n");
      const csv = "data:text/csv;charset=utf-8,\uFEFF" + header + rows;
      const encodedUri = encodeURI(csv);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `FTA_${topEventText || 'Analysis'}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    const LEVEL_STYLES = {
      root: {
        fontSize: '16px',
        bgColor: '#0f172a',
        textColor: '#ffffff',
        borderColor: '#0284c7'
      },
      level1: {
        fontSize: '14px',
        bgColor: '#f0f9ff',
        textColor: '#0c4a6e',
        borderColor: '#38bdf8'
      },
      level2: {
        fontSize: '12px',
        bgColor: '#f8fafc',
        textColor: '#334155',
        borderColor: '#cbd5e1'
      }
    };

    const COLOR_PRESETS = [
      { name: 'Sky (青)', bg: '#f0f9ff', text: '#0c4a6e', border: '#38bdf8' },
      { name: 'Emerald (緑)', bg: '#ecfdf5', text: '#064e3b', border: '#34d399' },
      { name: 'Amber (橙)', bg: '#fffbeb', text: '#78350f', border: '#fbbf24' },
      { name: 'Rose (赤)', bg: '#fff1f2', text: '#881337', border: '#fb7185' },
      { name: 'Slate (濃灰)', bg: '#0f172a', text: '#ffffff', border: '#475569' },
      { name: 'Light (明灰)', bg: '#ffffff', text: '#1e293b', border: '#cbd5e1' },
    ];

    const FONT_SIZES = [
      { label: '極小', value: '11px' },
      { label: '小', value: '12px' },
      { label: '中', value: '14px' },
      { label: '大', value: '16px' },
      { label: '特大', value: '18px' },
    ];

    const parseMarkdownToNodes = (text) => {
      const lines = text.split('\n');
      const nodes = [];
      const stack = [];
      let isFirst = true;

      lines.forEach(line => {
        if (!line.trim() || line.trim().startsWith('---')) return;

        const match = line.match(/^(\s*)([*+-]|\d+\.)\s+(.*)/);
        if (!match) {
          if (nodes.length > 0 && (line.trim().startsWith('※') || line.trim().startsWith('理由:'))) {
            nodes[nodes.length - 1].reason = (nodes[nodes.length - 1].reason ? nodes[nodes.length - 1].reason + ' ' : '') + line.trim();
          }
          return;
        }

        const indent = match[1].length;
        const content = match[3].trim();
        
        let nodeText = content;
        let nodeReason = '';
        const splitMatch = content.match(/^(.*?)[：:](.*)$/);
        if (splitMatch) {
          nodeText = splitMatch[1].trim();
          nodeReason = splitMatch[2].trim();
        }

        let level = 0;
        if (indent > 0) {
          level = Math.floor(indent / 2) + 1;
        }

        const nodeId = generateId();

        if (isFirst) {
          nodes.push({ 
            id: 'root', 
            parentId: null, 
            text: nodeText, 
            reason: nodeReason || 'トップイベント',
            ...LEVEL_STYLES.root
          });
          stack[0] = 'root';
          isFirst = false;
        } else {
          let parentId = 'root';
          for (let i = level - 1; i >= 0; i--) {
            if (stack[i]) {
              parentId = stack[i];
              break;
            }
          }
          
          const calculatedStyle = level === 1 ? LEVEL_STYLES.level1 : LEVEL_STYLES.level2;

          nodes.push({ 
            id: nodeId, 
            parentId: parentId, 
            text: nodeText, 
            reason: nodeReason,
            ...calculatedStyle
          });
          stack[level] = nodeId;
          stack.splice(level + 1);
        }
      });

      return nodes;
    };

    const parseOPMLToNodes = (xmlText) => {
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const outlines = xmlDoc.getElementsByTagName("outline");
        
        if (outlines.length === 0) return [];

        const nodes = [];
        const elementMap = new Map();

        Array.from(outlines).forEach((outline, index) => {
          const text = outline.getAttribute("text") || outline.getAttribute("title") || "要因";
          const reason = outline.getAttribute("_note") || outline.getAttribute("description") || "";
          const nodeId = index === 0 ? 'root' : generateId();
          
          elementMap.set(outline, nodeId);

          const parentOutline = outline.parentElement;
          let parentId = null;
          let depth = 0;

          let current = outline;
          while (current && current.parentElement && current.parentElement.tagName === "outline") {
            depth++;
            current = current.parentElement;
          }

          if (parentOutline && parentOutline.tagName === "outline") {
            parentId = elementMap.get(parentOutline) || 'root';
          } else if (index > 0) {
            parentId = 'root';
          }

          let calculatedStyle = LEVEL_STYLES.level2;
          if (index === 0) {
            calculatedStyle = LEVEL_STYLES.root;
          } else if (depth === 1) {
            calculatedStyle = LEVEL_STYLES.level1;
          }

          nodes.push({ 
            id: nodeId, 
            parentId, 
            text, 
            reason,
            ...calculatedStyle
          });
        });

        return nodes;
      } catch (e) {
        console.error("OPMLの解析に失敗しました", e);
        return [];
      }
    };

    const SAMPLE_MARKDOWN = `* インバータ評価中のSiC MOSFETモジュール短絡破壊
  * 電気的過ストレス（EOS） : 定格を超える電圧・電流の印加
    * ターンオフ時のサージ電圧 : 配線インダクタンスによるVdsスパイク
    * ゲート誤点灯 : dV/dt起因のセルフターンオンによる上下アーム短絡
  * 熱的ストレス（パワーサイクル寿命） : 接合部の繰り返し温度変化による疲労
    * ボンディングワイヤの剥離 : AlワイヤとSiCチップの熱膨張係数差
    * チップはんだ層のクラック : はんだ材の熱疲労による熱抵抗増大
  * 環境・構造起因の絶縁破壊 : モジュール内部の外的な要因
    * モールド樹脂内のボイド : 内部部分放電による絶縁劣化
    * 結露によるトラッキング : パッケージ表面のクリーページ距離不足`;

    // --- Components ---
    const TreeNode = ({ node, nodes, onAdd, onEdit, onDelete }) => {
      const children = nodes.filter(n => n.parentId === node.id);
      const isRoot = node.parentId === null;

      const nodeStyle = {
        backgroundColor: node.bgColor || '#ffffff',
        color: node.textColor || '#1e293b',
        borderColor: node.borderColor || '#cbd5e1',
        fontSize: node.fontSize || '13px'
      };

      return (
        <div className="flex items-center">
          <div className={`relative group shrink-0 flex items-center ${!isRoot ? 'ml-8' : ''}`}>
            {!isRoot && <div className="absolute top-1/2 -left-8 w-8 h-px bg-slate-400"></div>}
            <div 
              style={nodeStyle}
              className={`
                node-card relative p-4 rounded-xl border-2 w-64 shadow-sm transition-all duration-200
                ${isRoot ? 'shadow-md' : 'hover:shadow-md'}
              `}
            >
              <h3 className="font-bold leading-snug">{node.text}</h3>
              {node.reason && (
                <p 
                  style={{ color: node.textColor === '#ffffff' ? 'rgba(255,255,255,0.7)' : '#64748b' }}
                  className="text-xs mt-2 line-clamp-3 leading-relaxed" 
                  title={node.reason}
                >
                  {node.reason}
                </p>
              )}

              {/* Action Buttons on Hover */}
              <div className="absolute -top-4 -right-2 hidden group-hover:flex space-x-1 bg-white p-1 rounded-full shadow-lg border border-slate-200 z-10">
                <button onClick={() => onAdd(node)} className="p-1.5 text-emerald-600 hover:bg-emerald-100 rounded-full transition-colors" title="手動で子要素を追加">
                  <Plus size={14}/>
                </button>
                <button onClick={() => onEdit(node)} className="p-1.5 text-amber-600 hover:bg-amber-100 rounded-full transition-colors" title="スタイルと内容を編集">
                  <Edit2 size={14}/>
                </button>
                {!isRoot && (
                  <button onClick={() => onDelete(node.id)} className="p-1.5 text-rose-600 hover:bg-rose-100 rounded-full transition-colors" title="削除">
                    <Trash2 size={14}/>
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* Children Render recursion */}
          {children.length > 0 && (
            <div className="flex items-center">
              <div className="w-8 h-px bg-slate-400"></div>
              <div className="flex flex-col relative py-2">
                {children.map((child, idx) => (
                  <div key={child.id} className="relative flex items-center py-2">
                    <div className="absolute left-0 w-px bg-slate-400" style={{ top: idx === 0 ? '50%' : '0', bottom: idx === children.length - 1 ? '50%' : '0' }}></div>
                    <div className="absolute left-0 top-1/2 w-8 h-px bg-slate-400"></div>
                    <TreeNode node={child} nodes={nodes} onAdd={onAdd} onEdit={onEdit} onDelete={onDelete} />
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    const Modal = ({ isOpen, title, onClose, onSave, initialData }) => {
      const [text, setText] = useState('');
      const [reason, setReason] = useState('');
      
      const [fontSize, setFontSize] = useState('13px');
      const [bgColor, setBgColor] = useState('#ffffff');
      const [textColor, setTextColor] = useState('#1e293b');
      const [borderColor, setBorderColor] = useState('#cbd5e1');

      useEffect(() => { 
        if (isOpen) { 
          setText(initialData?.text || ''); 
          setReason(initialData?.reason || ''); 
          setFontSize(initialData?.fontSize || '13px');
          setBgColor(initialData?.bgColor || '#ffffff');
          setTextColor(initialData?.textColor || '#1e293b');
          setBorderColor(initialData?.borderColor || '#cbd5e1');
        } 
      }, [isOpen, initialData]);

      if (!isOpen) return null;

      const applyPreset = (preset) => {
        setBgColor(preset.bg);
        setTextColor(preset.text);
        setBorderColor(preset.border);
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div className="flex justify-between items-center p-4 border-b border-slate-200 bg-slate-50">
              <h2 className="font-bold text-slate-800">{title}</h2>
              <button onClick={onClose} className="p-1 text-slate-500 hover:bg-slate-200 rounded-full"><X size={20} /></button>
            </div>
            
            <div className="p-4 flex flex-col gap-4 overflow-y-auto">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">要因名</label>
                <input type="text" value={text} onChange={e => setText(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-sky-500" />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">詳細・メカニズム</label>
                <textarea value={reason} onChange={e => setReason(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg outline-none h-20 resize-none focus:ring-2 focus:ring-sky-500" />
              </div>

              <div className="border-t border-slate-100 pt-4">
                <h4 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                  <Type size={16} className="text-sky-600" /> スタイル設定
                </h4>

                {/* Font Size Selector */}
                <div className="mb-4">
                  <label className="block text-xs font-semibold text-slate-500 mb-1.5">フォントの大きさ</label>
                  <div className="flex gap-1 bg-slate-100 p-1 rounded-lg">
                    {FONT_SIZES.map((size) => (
                      <button
                        key={size.value}
                        type="button"
                        onClick={() => setFontSize(size.value)}
                        className={`flex-1 py-1 text-xs rounded-md transition-all ${fontSize === size.value ? 'bg-white shadow text-sky-700 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}
                      >
                        {size.label} ({size.value})
                      </button>
                    ))}
                  </div>
                </div>

                {/* Theme Preset Palettes */}
                <div className="mb-4">
                  <label className="block text-xs font-semibold text-slate-500 mb-2">カラーテーマ（かんたん選択）</label>
                  <div className="grid grid-cols-3 gap-2">
                    {COLOR_PRESETS.map((preset) => (
                      <button
                        key={preset.name}
                        type="button"
                        onClick={() => applyPreset(preset)}
                        style={{ backgroundColor: preset.bg, color: preset.text, borderColor: preset.border }}
                        className="py-2 px-2 text-xs rounded-lg border-2 font-medium transition-all text-center hover:scale-[1.02]"
                      >
                        {preset.name}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Custom Fine-Tune Colors */}
                <div className="grid grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 mb-1">背景色</label>
                    <div className="flex gap-2 items-center">
                      <input type="color" value={bgColor} onChange={e => setBgColor(e.target.value)} className="w-8 h-8 rounded border border-slate-300 cursor-pointer" />
                      <input type="text" value={bgColor} onChange={e => setBgColor(e.target.value)} className="w-full text-xs p-1 border border-slate-200 rounded outline-none font-mono" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 mb-1">文字色</label>
                    <div className="flex gap-2 items-center">
                      <input type="color" value={textColor} onChange={e => setTextColor(e.target.value)} className="w-8 h-8 rounded border border-slate-300 cursor-pointer" />
                      <input type="text" value={textColor} onChange={e => setTextColor(e.target.value)} className="w-full text-xs p-1 border border-slate-200 rounded outline-none font-mono" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 mb-1">枠線色</label>
                    <div className="flex gap-2 items-center">
                      <input type="color" value={borderColor} onChange={e => setBorderColor(e.target.value)} className="w-8 h-8 rounded border border-slate-300 cursor-pointer" />
                      <input type="text" value={borderColor} onChange={e => setBorderColor(e.target.value)} className="w-full text-xs p-1 border border-slate-200 rounded outline-none font-mono" />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Live Style Preview */}
            <div className="p-3 bg-slate-50 border-t border-slate-100 flex items-center justify-center">
              <div className="text-xs text-slate-400 mr-3">プレビュー：</div>
              <div 
                style={{ backgroundColor: bgColor, color: textColor, borderColor: borderColor, fontSize: fontSize }}
                className="p-3 rounded-lg border-2 w-52 shadow-sm text-center font-bold"
              >
                {text || 'サンプルテキスト'}
              </div>
            </div>

            <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 text-sm bg-white border border-slate-300 rounded-lg">キャンセル</button>
              <button 
                onClick={() => { if(text.trim()) onSave({ text, reason, fontSize, bgColor, textColor, borderColor }); }} 
                className="px-4 py-2 text-sm text-white bg-sky-600 rounded-lg flex items-center gap-1"
              >
                <Save size={16} className="inline mr-1" /> 保存
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- Main App Component ---
    function App() {
      const [nodes, setNodes] = useState([]);
      const [rawText, setRawText] = useState('');
      const [scale, setScale] = useState(1);
      const [pan, setPan] = useState({ x: 50, y: 80 });
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [modalState, setModalState] = useState({ isOpen: false, type: 'add', node: null });
      const exportTargetRef = useRef(null);

      const rootNode = nodes.find(n => n.parentId === null);

      useEffect(() => {
        setRawText(SAMPLE_MARKDOWN);
        setNodes(parseMarkdownToNodes(SAMPLE_MARKDOWN));
      }, []);

      const handleVisualize = () => {
        if (!rawText.trim()) return;
        if (rawText.trim().startsWith('<?xml') || rawText.trim().includes('<opml')) {
          setNodes(parseOPMLToNodes(rawText));
        } else {
          setNodes(parseMarkdownToNodes(rawText));
        }
        setPan({ x: 50, y: 100 });
      };

      const handleMouseDown = (e) => {
        if (e.target.closest('.node-card') || e.target.closest('button') || e.target.closest('textarea') || e.target.closest('input')) return;
        setIsDragging(true);
        setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
      };

      const handleMouseMove = (e) => { 
        if (isDragging) setPan({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y }); 
      };

      const handleMouseUp = () => setIsDragging(false);

      const handleAddNode = (parentNode) => setModalState({ 
        isOpen: true, 
        type: 'add', 
        node: parentNode, 
        data: { text: '', reason: '', fontSize: '12px', bgColor: '#ffffff', textColor: '#1e293b', borderColor: '#cbd5e1' } 
      });

      const handleEditNode = (node) => setModalState({ isOpen: true, type: 'edit', node: node, data: { ...node } });

      const handleDeleteNode = (nodeId) => {
        setNodes(prev => {
          let toDelete = new Set([nodeId]);
          let added = true;
          while(added) {
            added = false;
            prev.forEach(n => { if(toDelete.has(n.parentId) && !toDelete.has(n.id)) { toDelete.add(n.id); added = true; } });
          }
          return prev.filter(n => !toDelete.has(n.id));
        });
      };

      const saveModalData = (data) => {
        if (modalState.type === 'add') {
          setNodes(prev => [...prev, { 
            id: generateId(), 
            parentId: modalState.node.id, 
            text: data.text, 
            reason: data.reason,
            fontSize: data.fontSize,
            bgColor: data.bgColor,
            textColor: data.textColor,
            borderColor: data.borderColor
          }]);
        } else {
          setNodes(prev => prev.map(n => n.id === modalState.node.id ? { 
            ...n, 
            text: data.text, 
            reason: data.reason,
            fontSize: data.fontSize,
            bgColor: data.bgColor,
            textColor: data.textColor,
            borderColor: data.borderColor
          } : n));
        }
        setModalState({ isOpen: false, type: 'add', node: null });
      };

      const handleExportPNG = async () => {
        if (!exportTargetRef.current || nodes.length === 0) return;
        try {
          const origTransform = exportTargetRef.current.style.transform;
          exportTargetRef.current.style.transform = `scale(1) translate(0px, 0px)`;
          
          const wrapper = document.createElement('div');
          wrapper.style.padding = '40px';
          wrapper.style.background = '#f8fafc';
          wrapper.style.display = 'inline-block';
          const clone = exportTargetRef.current.cloneNode(true);
          wrapper.appendChild(clone);
          document.body.appendChild(wrapper);

          const canvas = await html2canvas(wrapper, { backgroundColor: '#f8fafc', scale: 2, logging: false });
          document.body.removeChild(wrapper);
          exportTargetRef.current.style.transform = origTransform;

          const link = document.createElement('a');
          link.download = `FTA_Tree_${rootNode?.text || 'Export'}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (err) { 
          alert("画像の生成に失敗しました。外部ネットワーク、またはブラウザのセキュリティ設定を確認してください。"); 
        }
      };

      return (
        <div className="h-screen w-full flex flex-col bg-slate-50 font-sans text-slate-800 overflow-hidden">
          {/* Header Bar */}
          <header className="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center z-20 shrink-0">
            <div className="flex items-center gap-3">
              <Cpu className="text-sky-400" size={24} />
              <h1 className="text-lg font-bold tracking-tight">FTA構造化テキスト・ビジュアルコンバーター</h1>
            </div>
            <div className="text-xs bg-slate-800 px-3 py-1.5 rounded text-slate-400">スタイル可変・GitHub配布版 (index.html)</div>
          </header>

          {/* Main Workspace Grid */}
          <div className="flex flex-1 overflow-hidden">
            {/* Left Sidebar Panel */}
            <div className="w-96 bg-white border-r border-slate-200 shadow-lg flex flex-col z-20 shrink-0">
              <div className="p-4 flex-1 flex flex-col gap-4 overflow-y-auto">
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="font-bold text-slate-700 text-sm flex items-center gap-1.5">
                      <FileText size={16} className="text-sky-600" />
                      構造化テキストを入力 (Markdown / OPML)
                    </label>
                    <button 
                      onClick={() => setRawText(SAMPLE_MARKDOWN)} 
                      className="text-xs text-sky-600 hover:underline flex items-center gap-0.5"
                    >
                      <RefreshCw size={12} className="inline" /> サンプルに戻す
                    </button>
                  </div>
                  <textarea 
                    value={rawText}
                    onChange={e => setRawText(e.target.value)}
                    placeholder="Gemini等のAIチャットから出力された、インデント付きの箇条書きテキスト（Markdown）またはXML/OPMLデータをここに貼り付けてください。"
                    className="w-full p-3 border border-slate-300 rounded-lg outline-none font-mono text-xs resize-none h-64 focus:ring-2 focus:ring-sky-500"
                  />
                </div>

                <button 
                  onClick={handleVisualize}
                  className="w-full py-2.5 px-4 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-lg shadow transition-colors text-sm flex justify-center items-center gap-2"
                >
                  <Clipboard size={16} />
                  貼り付けたテキストをツリーに変換
                </button>

                <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-600 space-y-2">
                  <h4 className="font-bold text-slate-700 flex items-center gap-1"><Info size={14} className="text-sky-600 inline" /> スタイル適用の特徴</h4>
                  <p>
                    入力された箇条書きのインデント（レベル）を自動判別し、大・中・小に沿ったフォントサイズと色が最初に自動適用されます。個別のスタイルは図の中のカードにホバーすると表示される「編集」アイコンから上書きできます。
                  </p>
                </div>

                <div className="mt-auto pt-4 border-t border-slate-100 flex flex-col gap-2">
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">エクスポート</h4>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={handleExportPNG} disabled={nodes.length === 0} className="py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 disabled:opacity-50 rounded-lg font-medium text-xs flex items-center justify-center gap-1 border border-slate-200 transition-colors">
                      <FileImage size={14} /> PNG画像
                    </button>
                    <button onClick={() => downloadCSV(nodes, rootNode?.text)} disabled={nodes.length === 0} className="py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 disabled:opacity-50 rounded-lg font-medium text-xs flex items-center justify-center gap-1 border border-slate-200 transition-colors">
                      <FileSpreadsheet size={14} /> CSVデータ
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* Right Infinite Canvas */}
            <div 
              className="flex-1 relative overflow-hidden bg-slate-50/50"
              onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}
              style={{ cursor: isDragging ? 'grabbing' : 'grab' }}
            >
              {/* Background radial dot grid */}
              <div className="absolute inset-0 pointer-events-none opacity-20" style={{ backgroundImage: 'radial-gradient(#cbd5e1 1px, transparent 1px)', backgroundSize: '24px 24px' }}></div>

              {nodes.length === 0 && (
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                  <p className="text-slate-400 text-sm">テキストを入力して変換ボタンを押してください</p>
                </div>
              )}

              {/* Viewport Transform Area */}
              <div 
                className="absolute origin-top-left transition-transform duration-75"
                style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${scale})` }}
              >
                <div ref={exportTargetRef} className="inline-block p-8">
                  {rootNode && <TreeNode node={rootNode} nodes={nodes} onAdd={handleAddNode} onEdit={handleEditNode} onDelete={handleDeleteNode} />}
                </div>
              </div>

              {/* Zoom Navigator UI */}
              <div className="absolute bottom-6 right-6 flex flex-col bg-white rounded-xl shadow-md border border-slate-200 p-1">
                <button onClick={() => setScale(s => Math.min(s + 0.1, 2))} className="p-2 text-slate-600 hover:text-sky-600 rounded" title="ズームイン"><ZoomIn size={18} /></button>
                <button onClick={() => { setScale(1); setPan({ x: 50, y: 80 }); }} className="p-2 text-slate-500 font-bold text-xs hover:text-sky-600" title="ズームをリセット">100%</button>
                <button onClick={() => setScale(s => Math.max(s - 0.1, 0.4))} className="p-2 text-slate-600 hover:text-sky-600 rounded" title="ズームアウト"><ZoomOut size={18} /></button>
              </div>
            </div>
          </div>

          {/* Create/Edit Node Modal */}
          <Modal isOpen={modalState.isOpen} title={modalState.type === 'add' ? '下位要因の追加' : 'スタイルと内容の編集'} onClose={() => setModalState({ isOpen: false, type: 'add', node: null })} onSave={saveModalData} initialData={modalState.data} />
        </div>
      );
    }

    // --- Bootstrapping the React App ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
